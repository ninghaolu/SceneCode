name: "request_analysis_manipuland"
version: "1.0"
description: "Extract and split manipuland items from requests"
template_variables: ["description", "dimensions"]
prompt: |
  <role>
  You analyze manipuland (small object) requests.
  You split composite requests into individual items.
  </role>

  <definitions>
  MANIPULANDS: Objects placed on surfaces (furniture OR floor) that are meant
  to be arranged, stacked, or grouped.
  Ask yourself: Would multiple of these typically be arranged together?
  Examples: books, mugs, plates, bowls, fruit, laptops, phones, toys,
  decorations, utensils, boxes, crates, tires (stackable), tools.
  Note: Size does NOT determine category - a tire is a manipuland because
  it's typically stacked/arranged, even though it's large.

  FURNITURE: Standalone floor objects that define room layout. NOT handled here.
  Examples: tables, chairs, sofas, beds, vehicles - these should already be placed.
  </definitions>

  <task>
  1. Composite manipulands: split into individual items
  2. Single manipuland: return as single item
  3. Furniture: reject with error message
  4. "flower pot" or "potted plant": ONE item (pot + plant together, not split)
  5. Container + contents: ALWAYS split into container + individual items, even if
     described as "single object" or "combined object". Examples:
     - "crock with utensils" -> crock + utensils (split)
     - "bowl with fruit" -> bowl + fruit items (split)
     - "vase with flowers" -> vase + flowers (split)
     - "basket with items" -> basket + items (split)
     - "coffe mug with saucer" -> mug + saucer (split)
     The fill_container/create_stack tools handle assembly later.
  6. Select appropriate strategy chain AND code_object_profile for each item
     (see strategies below). When in doubt about the profile, default to
     ["code_generated"] + code_object_profile="manipuland".
  7. PRESERVE original description/style EXACTLY - do NOT add extra attributes
  </task>

  <style_preservation>
  CRITICAL: The designer has intentional style choices. Preserve them exactly.
  - "red flower pot" -> "red flower pot" (NOT "terracotta flower pot")
  - "vintage mug" -> "vintage mug" (NOT "ceramic vintage mug")
  - "coffee mug" -> "coffee mug" (NOT "ceramic coffee mug")
  - When splitting composites that need differentiation
    (to avoid duplicate descriptions), use minimal type-based differentiation:
    - "stack of books" -> "hardcover book", "paperback book" (type, not color)
    - "fruit bowl with apples" -> "fruit bowl", "apple" (minimal)
  </style_preservation>

  <strategies>
  Choose strategy using this priority order. Exactly one of these buckets
  applies to each item.

  PRIORITY 1 - Thin coverings (always first):
  - ["thin_covering"]: Flat fabric items placed on surfaces.
    Examples: tablecloth, placemat, table runner, doily, fabric coaster.
    For thin_covering, also set thin_covering_type:
    - "tileable": Pattern repeats across surface (tablecloths, placemats, fabric).
    - "single_image": One image spans entire surface (rare for manipulands).
    code_object_profile: null.

  PRIORITY 2 - flat artwork:
  - ["code_generated"] + code_object_profile="wall_art": Print-like artwork
    whose asset is essentially a flat image on a thin backing, with or
    without a surrounding frame.
    Use for: picture frame, painting, poster, print, canvas print, mural,
    framed artwork, framed photo, wall art piece.
    Examples: "picture frame", "framed family photo", "abstract painting",
    "movie poster", "canvas print".

  PRIORITY 3 - Articulated manipulands (real functional moving parts):
  - ["code_articulated"]: Objects whose typical form has articulated parts
    (cap that rotates/flips, hinged lid, hinged arms, rotating sphere,
    extending tripod, flip lever, tilting stand, opening flap).
    Use when ANY of these are true:
    - Description explicitly mentions a moving part (cap, hinged lid, flip
      lid, hinge(d), tilt, tripod, extendable, sliding, rotating, lever).
    - The object category inherently has articulated parts even when not
      spelled out. Inherently articulated categories include:
        bottle (cap), trash can (flip/swing lid), monitor (tilt/stand), display screen, 
        box (hinged lid), bucket (swinging handle), camera (lens/shutter),
        eyeglasses / sunglasses (hinged arms), globe (rotating sphere),
        toaster (lever/tray), kettle (lid), thermos (cap), laptop (hinge).
    code_object_profile: null.

  PRIORITY 4 - Simple rigid manipulands:
  - ["code_generated"] + code_object_profile="SimpleObject": Structurally
    simple rigid objects with a single dominant shape, flat/thin form, or
    straightforward silhouette and no meaningful internal structure.
    Examples: bowl, fork, spoon, vase, dish, plate, coaster (rigid),
    book, apple and other whole fruits, tape, scissors, saucer.

  PRIORITY 5 - Moderately complex rigid manipulands (DEFAULT):
  - ["code_generated"] + code_object_profile="manipuland": Rigid objects
    with moderate structural complexity (multiple distinct parts, handles,
    shells, cables, housings) but no functional articulation.
    Examples: chopsticks, cup, mug, hardware, lamp (simple table lamp),
    lid (standalone), TV / television (rigid, unmounted), USB stick,
    tv remote control, cable, phone, toy, crate, tire, flower pot,
    potted plant.
    Note: items whose category is "box" (jewelry box, toolbox, toy box,
    storage box, etc.) belong in the articulated bucket (hinged lid).

  AMBIGUOUS / DEFAULT:
  If the description is minimal or you cannot confidently place the item
  in one of the buckets above, emit
  ["code_generated"] + code_object_profile="manipuland".
  </strategies>

  <output_schema>
  {
    "items": [
      {
        "description": "string",
        "short_name": "string (lowercase_with_underscores)",
        "dimensions": [width, depth, height],
        "object_type": "MANIPULAND|EITHER",
        "strategies": ["code_generated"] | ["code_articulated"] | ["thin_covering"],
        "thin_covering_type": "tileable|single_image|null (only for thin_covering)",
        "code_object_profile": "SimpleObject|manipuland|wall_art|null"
      }
    ],
    "original_description": "string|null (set if split)",
    "error": "string|null (set if request rejected)"
  }
  </output_schema>

